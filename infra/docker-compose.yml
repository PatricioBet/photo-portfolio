# Photo Portfolio — Docker Compose
#
# Services: postgres, redis, api, web, admin, media-worker, caddy, tunnel
#
# Usage:
#   docker compose up -d          # start all services
#   docker compose down           # stop and remove containers
#   docker compose logs -f api    # view logs
#
# Security rules:
#   - No public ports; only bind to 127.0.0.1 in development
#   - No privileged, network_mode: host, or Docker socket mounts
#   - Secrets via .env; never committed
#   - All services have restart: unless-stopped and healthcheck

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ── PostgreSQL 16 ───────────────────────────────────────────
  postgres:
    <<: *common
    image: postgres:16-alpine
    container_name: photo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patriciobet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-photo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-wal:/var/lib/postgresql/wal
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=3
      -c wal_keep_size=256MB
      -c synchronous_commit=on
      -c fsync=on
      -c log_checkpoints=on
      -c log_connections=on
      -c log_disconnections=on
      -c log_lock_waits=on
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patriciobet} -d ${POSTGRES_DB:-photo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Redis 7 ─────────────────────────────────────────────────
  redis:
    <<: *common
    image: redis:7-alpine
    container_name: photo-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── NestJS API ──────────────────────────────────────────────
  api:
    <<: *common
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      args:
        NODE_ENV: ${NODE_ENV:-development}
    container_name: photo-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_URL: postgres://${POSTGRES_USER:-patriciobet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-photo}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_URL: ${API_URL:-http://localhost:3000}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/data/media}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL}
      CONTACT_FROM_NAME: ${CONTACT_FROM_NAME:-Patricio Betancourt}
      RP_ID: ${RP_ID:-photo.patriciobet.dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - media-storage:/data/media
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Astro Web (node-server adapter) ─────────────────────────
  web:
    <<: *common
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        NODE_ENV: ${NODE_ENV:-development}
    container_name: photo-web
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 4321
      API_URL: ${API_URL:-http://api:3000}
      WEB_URL: ${WEB_URL:-http://localhost:4321}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:4321:4321"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4321/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── React Admin (Vite production) ───────────────────────────
  admin:
    <<: *common
    build:
      context: ..
      dockerfile: infra/Dockerfile.admin
      args:
        NODE_ENV: ${NODE_ENV:-development}
    container_name: photo-admin
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_URL: ${API_URL:-http://api:3000}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${API_URL:-http://api:3000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Media Worker ────────────────────────────────────────────
  media-worker:
    <<: *common
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
      args:
        NODE_ENV: ${NODE_ENV:-development}
    container_name: photo-media-worker
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_URL: postgres://${POSTGRES_USER:-patriciobet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-photo}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_URL: ${API_URL:-http://localhost:3000}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/data/media}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL}
      CONTACT_FROM_NAME: ${CONTACT_FROM_NAME:-Patricio Betancourt}
      RP_ID: ${RP_ID:-photo.patriciobet.dev}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - worker-tmp:/tmp/worker
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Caddy Reverse Proxy ─────────────────────────────────────
  caddy:
    <<: *common
    image: caddy:2.8-alpine
    container_name: photo-caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Cloudflare Tunnel (sidecar) ─────────────────────────────
  # Uncomment when tunnel is configured:
  # tunnel:
  #   <<: *common
  #   image: cloudflare/cloudflared:latest
  #   container_name: photo-tunnel
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #   environment:
  #     CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     caddy:
  #       condition: service_healthy
  #   restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  postgres-wal:
    driver: local
  redis-data:
    driver: local
  worker-tmp:
    driver: local
  media-storage:
    driver: local
